# Canonical roster fields, grouped by entity. This file is the source of truth:
# edit it, then run `pnpm schema` to regenerate src/schema.generated.ts.

#   type         output data type: string, digits, date, enum or boolean
#   description  what the field holds (shown in the data dictionary)
#   format       expected output format or allowed values; `code` renders as code
#   required     actions (ADD, UPDATE, TERM) for which a row must have this field: rows missing it are flagged
#   preferred    actions for which the field should be filled if the file has it: always shown on the Map
#                step, never flagged. A field neither required nor preferred for an action is optional.
#   values       column value types the field accepts, most likely first (see src/profile/value-type.ts)
#   aliases      headers that mean this field. Write them as they appear in files;
#                matching normalizes case, punctuation and abbreviations.
#   not          look-alike headers that must never map here
#   inverted     headers that map here with the meaning flipped ("Exclude from Directory": Y = hide)
#   related      headers that might mean this field, though another field's alias claims them
#                ("Group Name" is practice.dba, maybe billing.legal_name): the column becomes a
#                candidate scoring at most 0.6, offered on the Map step, never mapped over an alias
#   hidden       true: the Map step leaves the field out of its table unless a column maps to it
#                (every other field always has a row there, mapped or not)
#   input        true: typed on the Upload step, one value for every row; never mapped from a column,
#                left out of the Map, Standardize and Validate steps. Needs hidden: true and no aliases,
#                so it reaches the output only when filled

