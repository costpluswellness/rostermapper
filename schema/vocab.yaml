# Words the header matcher treats specially. Applies to every field.

#   abbreviations  rewritten before matching ("prov" → "provider")
#   stopwords      dropped before matching
#   slots          words that number a field ("Secondary Taxonomy" → taxonomy_2); digits 1–4 are slots too
#   neutral        modifiers that don't change meaning ("Location City" ≈ "City")
#   qualifiers     words that change whose data it is ("Billing Zip" ≠ practice.zip)
#   ignore         columns with no canonical field (SSN, board certification, ...)

abbreviations:
  prov: provider
  addr: address
  dob: date of birth
  loc: location
  tin: tax id
  ind: individual
  eff: effective
  lic: license
  l1: line 1
  l2: line 2
  postal: zip
  num: number
  exp: expiration
  st.: state
  term: termination
  grp: group
  biling: billing
stopwords: [ xxx, xxxx, a, an, the, of, and, or, if, any, to, for, as, in, with, by, is ]
slots:
  primary: 1
  secondary: 2
  sub: 2
  tertiary: 3
neutral: [ location, physical, office, practice, service, site, account, texas, tx ]
