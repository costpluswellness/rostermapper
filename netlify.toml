# The public demo site: one page with the docs, the UI at /app/ and the sample rosters (demo/).
# Build locally with `pnpm demo`, preview with `pnpm demo:serve`.
[build]
  command = "pnpm build && node scripts/build-demo-site.ts"
  publish = "demo/_site"
  functions = "demo/netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
