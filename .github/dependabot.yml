version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # @types/node follows the oldest Node we support (engines: >=22).
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # TypeScript 7 (the native compiler) has no JS API yet, which tsup's .d.ts build needs.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
